<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silence Remover + Normalization</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Silence Remover + Normalization</h1>
      <p>Detect &amp; cut silent gaps, then normalize loudness &mdash; MP3 &amp; WAV.</p>
    </div>
    <span class="health" id="health">loading</span>
  </header>

  <main class="layout">
    <aside class="panel settings">
      <section>
        <h2>1 · Source</h2>
        <input type="text" id="folder" placeholder="C:\Users\You\Music" spellcheck="false" />
        <div class="row">
          <button id="chooseFolderBtn" class="btn primary">Choose folder…</button>
          <button id="chooseFileBtn" class="btn">Choose file…</button>
        </div>
        <button id="scanBtn" class="btn wide">Scan</button>
      </section>

      <section>
        <h2>2 · Silence settings</h2>

        <div class="field">
          <label>Scope</label>
          <label class="radio">
            <input type="radio" name="scopemode" value="all" />
            <span>All silences <em>(leading + middle + trailing)</em></span>
          </label>
          <label class="radio">
            <input type="radio" name="scopemode" value="edges" checked />
            <span>Edges only <em>(leading + trailing)</em></span>
          </label>
        </div>

        <div class="field">
          <label for="minSilence">Min silence</label>
          <div class="control">
            <input type="number" id="minSilenceNum" min="0.1" max="10" step="0.1" value="0.5" />
            <span class="unit">s</span>
          </div>
          <input type="range" id="minSilence" min="0.1" max="10" step="0.1" value="0.5" />
        </div>

        <div class="field">
          <label for="thresh">Noise threshold</label>
          <div class="control">
            <input type="number" id="threshNum" min="-60" max="-10" step="1" value="-50" />
            <span class="unit">dB</span>
          </div>
          <input type="range" id="thresh" min="-60" max="-10" step="1" value="-50" />
        </div>

        <div class="field">
          <label for="padding">Keep padding</label>
          <div class="control">
            <input type="number" id="paddingNum" min="0" max="2" step="0.05" value="0.2" />
            <span class="unit">s</span>
          </div>
          <input type="range" id="padding" min="0" max="2" step="0.05" value="0.2" />
        </div>

        <div class="field">
          <label for="trimEnd">Trim end <em class="hint">(trailing glitch)</em></label>
          <div class="control">
            <input type="number" id="trimEndNum" min="0" max="5" step="0.05" value="0.2" />
            <span class="unit">s</span>
          </div>
          <input type="range" id="trimEnd" min="0" max="5" step="0.05" value="0.2" />
        </div>
      </section>

      <section>
        <h2>3 · Output</h2>
        <label class="radio">
          <input type="radio" name="outmode" value="folder" />
          <span>New folder <em>(<code>silence_removed</code>)</em></span>
        </label>
        <label class="radio">
          <input type="radio" name="outmode" value="overwrite" checked />
          <span>Overwrite originals</span>
        </label>
        <label class="radio">
          <input type="checkbox" id="backup" />
          <span>Back up originals (<code>.orig</code> copy) <em>(overwrite mode)</em></span>
        </label>
        <input type="text" id="outputDir" placeholder="Custom output dir (optional)" spellcheck="false" />
      </section>
    </aside>

    <section class="panel files">
      <div class="files-head">
        <div class="summary" id="summary">No files scanned yet.</div>
        <div class="actions">
          <button id="analyzeAllBtn" class="btn">Analyze selected</button>
          <button id="cutSelectedBtn" class="btn danger" disabled>Cut selected</button>
          <button id="analyzeVolBtn" class="btn">Analyze volume</button>
          <button id="normalizeBtn" class="btn">Normalize</button>
        </div>
      </div>

      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel"></div>
      </div>

      <div class="list-head">
        <label class="check all">
          <input type="checkbox" id="selectAll" />
          <span>All</span>
        </label>
        <span class="col-name">File</span>
        <span class="col-dur">Duration</span>
        <span class="col-sil">Silences</span>
        <span class="col-cut">Removable</span>
        <span class="col-loud">Loudness</span>
        <span class="col-status">Status</span>
      </div>

      <div id="fileList" class="file-list"></div>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
